[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-search-console-multi"
version = "0.1.3"
description = "Multi-account Google Search Console MCP server"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["mcp", "google-search-console", "seo", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "fastmcp>=2.0.0",
    "google-api-python-client>=2.120.0",
    "google-auth>=2.29.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",
]

[project.scripts]
mcp-search-console-multi = "gsc.server:main"

[tool.hatch.build.targets.wheel]
packages = ["gsc"]

[tool.ruff]
# Pinned: newer ruff releases change the default rule set. Run `uvx ruff@0.17.5 check .`;
# bump this pin and the command together in a dedicated lint-conformance change.
required-version = "==0.17.5"
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# MCP tool handlers are the error boundary: every failure is converted into an
# error payload for the client instead of crashing the server (see _err).
# retry._extract_reason falls back to str(e) for any unparseable error body.
"gsc/server.py" = ["BLE001"]
"gsc/retry.py" = ["BLE001"]
