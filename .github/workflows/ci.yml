name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.11
      - run: uv pip install -e .
      - name: Lint
        # ruff is pinned: 0.16 expanded the default rule selection, which fails
        # the pre-existing gsc/ sources on an otherwise unchanged tree. Lifting
        # the pin requires a lint-conformance pass over gsc/ in its own change.
        run: uvx ruff@0.15.22 check gsc/
      - name: Test
        run: uv run python -m unittest discover -s tests -v
